# Fake DX metrics platform. Secret "dxfake": DXFAKE_TOKEN (same value the server uses).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dxfake
  namespace: factory
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: dxfake } }
  template:
    metadata: { labels: { app: dxfake } }
    spec:
      containers:
        - name: dxfake
          image: openfactory
          imagePullPolicy: IfNotPresent
          args: ["plugins/metrics-dxfake/dist/main.js"]
          ports: [{ containerPort: 8787, name: http }]
          env:
            - { name: DXFAKE_PORT, value: "8787" }
            - { name: DXFAKE_DATA_FILE, value: /data/dx/dx.json }
          envFrom: [{ secretRef: { name: dxfake } }]
          volumeMounts: [{ name: data, mountPath: /data/dx, subPath: dx }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 192Mi } }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: factory-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: dxfake, namespace: factory }
spec:
  selector: { app: dxfake }
  ports: [{ port: 8787, targetPort: http, name: http }]
