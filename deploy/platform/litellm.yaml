# Model proxy. Every model call in the factory goes through here; the Anthropic key never
# leaves this pod. Hard caps: proxy-wide max_budget $60 and the factory virtual key's own $60.
# Prices are set explicitly so spend tracking does not depend on LiteLLM's price map knowing
# the model (an unknown model would count as $0 and slip past the budget).
apiVersion: v1
kind: ConfigMap
metadata: { name: litellm-config, namespace: factory }
data:
  config.yaml: |
    model_list:
      - model_name: claude-sonnet
        litellm_params: { model: anthropic/claude-sonnet-5-5, api_key: os.environ/ANTHROPIC_API_KEY }
        model_info: { input_cost_per_token: 0.000002, output_cost_per_token: 0.00001, cache_read_input_token_cost: 0.0000001, cache_creation_input_token_cost: 0.0000025 }
      - model_name: claude-sonnet-5-5
        litellm_params: { model: anthropic/claude-sonnet-5-5, api_key: os.environ/ANTHROPIC_API_KEY }
        model_info: { input_cost_per_token: 0.000002, output_cost_per_token: 0.00001, cache_read_input_token_cost: 0.0000001, cache_creation_input_token_cost: 0.0000025 }
      - model_name: claude-haiku
        litellm_params: { model: anthropic/claude-haiku-5-5, api_key: os.environ/ANTHROPIC_API_KEY }
        model_info: { input_cost_per_token: 0.0000001, output_cost_per_token: 0.0000005, cache_read_input_token_cost: 0.00000001, cache_creation_input_token_cost: 0.000000125 }
      - model_name: claude-haiku-5-5
        litellm_params: { model: anthropic/claude-haiku-5-5, api_key: os.environ/ANTHROPIC_API_KEY }
        model_info: { input_cost_per_token: 0.0000001, output_cost_per_token: 0.0000005, cache_read_input_token_cost: 0.00000001, cache_creation_input_token_cost: 0.000000125 }
      - model_name: mock
        litellm_params: { model: anthropic/claude-haiku-5-5, mock_response: "mock reply", api_key: os.environ/ANTHROPIC_API_KEY }
    litellm_settings:
      max_budget: 60
      budget_duration: 30d
      drop_params: true
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/LITELLM_DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: litellm, namespace: factory }
spec:
  replicas: 1
  selector: { matchLabels: { app: litellm } }
  template:
    metadata: { labels: { app: litellm } }
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm-database:main-stable
          args: [--config, /etc/litellm/config.yaml, --port, "4000"]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: litellm, key: ANTHROPIC_API_KEY } }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm, key: LITELLM_MASTER_KEY } }
            - name: LITELLM_DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres, key: LITELLM_DATABASE_URL } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: postgres, key: LITELLM_DATABASE_URL } } }
          ports: [{ containerPort: 4000 }]
          readinessProbe: { httpGet: { path: /health/readiness, port: 4000 }, periodSeconds: 10, failureThreshold: 30 }
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1536Mi } }
          volumeMounts: [{ name: config, mountPath: /etc/litellm }]
      volumes: [{ name: config, configMap: { name: litellm-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: litellm, namespace: factory }
spec: { selector: { app: litellm }, ports: [{ port: 4000 }] }
