# This VM's instance of deploy/k8s. Images are built in-cluster by ../build-image.sh and imported into
# k3s containerd (no registry), so the tag here must match what was built.
#   kubectl apply -k deploy/hetzner/overlay
# Hosts use the dotted IP so they match the certbot cert the VM issued at boot
# (factory., dashboard., dx.<ip>.sslip.io); no per-host ACME needed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
images:
  - name: ghcr.io/nisarahamedk/openfactory
    newName: openfactory
    newTag: d9242bc
patches:
  - target: { kind: Ingress, name: factory }
    patch: |-
      - { op: replace, path: /spec/rules/0/host, value: factory.178.105.22.96.sslip.io }
      - { op: replace, path: /spec/rules/1/host, value: dashboard.178.105.22.96.sslip.io }
      - { op: replace, path: /spec/rules/2/host, value: dx.178.105.22.96.sslip.io }
  - target: { kind: Deployment, name: openfactory }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1
        value: { name: PUBLIC_URL, value: "https://factory.178.105.22.96.sslip.io" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: WORKER_IMAGE, value: "openfactory-worker:dev" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: FACTORY_DOMAIN, value: "178.105.22.96.sslip.io" }
      # Workspaces and DevSpace task environments.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: WORKSPACE_NAMESPACE, value: "factory-workspaces" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ENV_APP_URL_TEMPLATE, value: "https://{namespace}.178.105.22.96.sslip.io" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ENV_COPY_SECRETS, value: "factory/firstword-dev" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ENV_AGENT_VARS, value: "FACTORY_DOMAIN=178.105.22.96.sslip.io,FIRSTWORD_REMOTE_BINDINGS=off,WRANGLER_SEND_METRICS=false" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ENV_DEPLOY_COMMAND, value: "devspace dev --namespace {namespace}" }
      # Per-task LiteLLM keys: the server mints a capped key per task with the master key;
      # sandboxes only ever see their own task key.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: LITELLM_ADMIN_URL, value: "http://litellm.factory.svc:4000" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: LITELLM_MASTER_KEY, valueFrom: { secretKeyRef: { name: litellm, key: LITELLM_MASTER_KEY } } }
      # Sandboxes reach the internet only through the egress proxy (deploy/platform/egress.yaml);
      # in-cluster routes (kubectl/devspace, LiteLLM) go direct and NetworkPolicy allows them.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: WORKSPACE_EGRESS_PROXY, value: "http://egress-proxy.factory-egress.svc:3128" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: WORKSPACE_NO_PROXY, value: "localhost,127.0.0.1,::1,.svc,.cluster.local,10.43.0.0/16" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: TASK_KEY_MODELS, value: "claude-sonnet,claude-haiku" }
      # Token for the workspace's clone init container only (stored per task as <ws>-git; the agent container never mounts it).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: WORKSPACE_GIT_TOKEN, valueFrom: { secretKeyRef: { name: github, key: GITHUB_TOKEN } } }
  # LiteLLM serves both /chat/completions and /v1/messages at its root; with a /v1 base the agent's
  # Anthropic client called /v1/v1/messages (404).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: openfactory, namespace: factory }
      spec:
        template:
          spec:
            containers:
              - name: server
                env: [{ name: MODEL_PROXY_URL, value: "http://litellm.factory.svc:4000" }]
