{{- /* Generated once, kept on upgrade (lookup). Bring your own with generated.existingSecret. */}}
{{- if not .Values.generated.existingSecret }}
{{- $name := include "of.generatedSecret" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "of.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
data:
  FACTORY_API_TOKEN: {{ get $old "FACTORY_API_TOKEN" | default (randAlphaNum 40 | b64enc) }}
  LITELLM_MASTER_KEY: {{ get $old "LITELLM_MASTER_KEY" | default (printf "sk-%s" (randAlphaNum 40) | b64enc) }}
  DASHBOARD_PASSWORD: {{ get $old "DASHBOARD_PASSWORD" | default (randAlphaNum 24 | b64enc) }}
{{- end }}
{{- if .Values.postgres.enabled }}
---
{{- /* The URLs embed the password, so they live in their own Secret built from the generated one. */}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" .Release.Name)).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "of.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
{{- if $old }}
data: {{- toYaml $old | nindent 2 }}
{{- else }}
{{- $p := randAlphaNum 32 }}
{{- $host := include "of.svc" (dict "root" . "name" "postgres") }}
stringData:
  POSTGRES_PASSWORD: {{ $p | quote }}
  DATABASE_URL: {{ printf "postgres://factory:%s@%s:5432/factory" $p $host | quote }}
  LITELLM_DATABASE_URL: {{ printf "postgres://factory:%s@%s:5432/litellm" $p $host | quote }}
{{- end }}
{{- end }}
