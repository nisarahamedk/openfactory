{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels: {{- include "of.labels" . | nindent 4 }}
data:
  litellm.sql: "CREATE DATABASE litellm;"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "of.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: postgres } }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: factory }
            - { name: POSTGRES_DB, value: factory }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-postgres, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, factory] }, periodSeconds: 5 }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - { name: init, configMap: { name: {{ .Release.Name }}-postgres-init } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "of.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: postgres }
  ports: [{ port: 5432 }]
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-litellm
  labels: {{- include "of.labels" . | nindent 4 }}
    app.kubernetes.io/name: litellm
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: litellm } }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: litellm }
      annotations:
        checksum/config: {{ toYaml .Values.litellm | sha256sum | trunc 16 }}
    spec:
      containers:
        - name: litellm
          image: {{ .Values.litellm.image }}
          args: [--config, /etc/litellm/config.yaml, --port, "4000"]
          env:
            {{- range .Values.secrets.modelProviders }}
            - name: {{ .env }}
              valueFrom: { secretKeyRef: { name: {{ .name }}, key: {{ .key }} } }
            {{- end }}
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "of.generatedSecret" . }}, key: LITELLM_MASTER_KEY } }
            - name: LITELLM_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "of.dbSecret" . }}, key: {{ include "of.dbLitellmKey" . }} } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "of.dbSecret" . }}, key: {{ include "of.dbLitellmKey" . }} } }
          ports: [{ containerPort: 4000, name: http }]
          readinessProbe: { httpGet: { path: /health/readiness, port: 4000 }, periodSeconds: 10, failureThreshold: 30 }
          resources: {{- toYaml .Values.litellm.resources | nindent 12 }}
          volumeMounts: [{ name: config, mountPath: /etc/litellm }]
      volumes: [{ name: config, configMap: { name: {{ .Release.Name }}-litellm } }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-litellm
  labels: {{- include "of.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: litellm }
  ports: [{ port: 4000, targetPort: http, name: http }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "of.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.server.host }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-server, port: { number: 3000 } } } }] }
    {{- if .Values.dashboard.enabled }}
    - host: {{ .Values.ingress.dashboard.host }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-dashboard, port: { number: 8080 } } } }] }
    {{- end }}
{{- end }}
